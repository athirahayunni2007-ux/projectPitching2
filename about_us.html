<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <title>About Us · CampusMind</title>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>

  /* Accessibility tool bars */
  .accessibility-tools { 
    display: flex; 
    gap: 6px; 
    background: #fff; 
    padding: 4px; 
    border-radius: 8px; 
    border: 1px solid var(--cm-border); 
    display: inline-flex; 
    margin-bottom: 10px;
  }

  .btn-access {
    background: transparent; 
    border: none; 
    color: var(--cm-text); 
    padding: 4px 10px; 
    font-weight: 700; 
    font-size: 14px; 
    cursor: pointer; 
    border-radius: 6px; 
    transition: 0.1s; 
  }

  .btn-access:hover { 
    background: var(--cm-green-soft); 
    color: var(--cm-green-dark); 
  }

  .about-wrap{
    max-width:900px
  }

  .hero{
    background:linear-gradient(135deg,var(--cm-green) 0%,var(--cm-green-dark) 100%);
    color:#fff;
    border-radius:16px;
    padding:40px 36px;
    margin-bottom:24px;
    box-shadow:var(--cm-shadow);
  }

  .hero h3{
    margin:0 0 10px;
    font-size:24px
  }

  .hero p{
    margin:0;
    line-height:1.7;
    opacity:.95;
    max-width:680px
  }

  .grid-2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px
  }

  .info-card{
    padding:24px
  }

  .info-card h4{
    margin:0 0 8px;
    font-size:17px;
    display:flex;
    align-items:center;
    gap:10px
  }

  .info-card .ico{
    width:34px;
    height:34px;
    border-radius:10px;
    background:var(--cm-green-soft);
    color:var(--cm-green-dark);
    display:inline-flex;
    align-items:center;
    justify-content:center;
  }

  .info-card .ico svg{
    width:18px;
    height:18px;
    stroke:currentColor;
    fill:none;
    stroke-width:2
  }

  .info-card p{
    margin:0;
    color:var(--cm-muted);line-height:1.65
  }

  .team-card{
    padding:24px;
    margin-top:24px
  }

  .team-card h4{
    margin:0 0 16px;
    font-size:17px
  }

  .team-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px
  }

  .member{
    text-align:center;
    padding:16px;
    border:1px solid var(--cm-border);
    border-radius:12px
  }

  .member .avatar{
    width:64px;
    height:64px;
    border-radius:50%;
    margin:0 auto 10px;
    background:var(--cm-green-soft);
    color:var(--cm-green-dark);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    font-size:22px;
  }

  .member .name{
    margin:0;
    font-weight:600;
    font-size:14px
  }

  .member .role{
    margin:2px 0 0;
    color:var(--cm-muted);font-size:12px
  }

  .loading{
    padding:30px;
    text-align:center;
    color:var(--cm-muted)
  }

  @media(max-width:990px){
    .grid-2{grid-template-columns:1fr}
    .team-grid{grid-template-columns:1fr 1fr}
  }
  
  @media(max-width:600px){
    .hero{padding:24px 20px}
    .hero h3{font-size:20px}
    .team-grid{grid-template-columns:1fr}
  }

  </style>
</head>

<body>
<div class="cm-app">

  <!-- Sidebar navigation -->
  <aside class="cm-sidebar">
    <h1 class="cm-brand">CampusMind</h1>
    <p class="cm-brand-sub">Student Mental Wellness</p>

    <!-- User info -->
    <div class="cm-user">
      <div class="cm-avatar" id="user-initials">U</div>
            <div>
                <div class="cm-uname" id="user-display-name">User</div>
                <div class="cm-urole">Undergraduate</div>
            </div>
    </div>

    <!-- Navigation links -->
    <nav class="cm-nav">

      <a href="dashboard.html">
            <i class="bi bi-grid-1x2-fill"></i> Dashboard
      </a>

      <a href="daily_tasks.html">
            <i class="bi bi-check2-square"></i> Daily Task
      </a>

      <a href="resource_library.html">
          <i class="bi bi-book"></i> Resources
      </a>

      <a href="support.html">
          <i class="bi bi-telephone"></i> Support
      </a>

      <a href="about_us.html">
          <i class="bi bi-people"></i> About Us
        </a>
    </nav>

    <!-- Logout -->
    <a href="index.html" class="cm-logout" onclick="localStorage.removeItem('activeUser');">
    <i class="bi bi-box-arrow-right"> Log Out</i> 
    </a>
  </aside>

  <!-- Main content -->
  <main class="cm-main">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div>
        <h2 class="cm-page-title">About Us</h2>
        <p class="cm-page-sub">Empowering IIUM students to take charge of their mental wellness.</p>
      </div>

      <!-- Accessibility buttons -->
      <div class="accessibility-tools">
        <button class="btn-access" onclick="changeFontSize('up')">A+</button>
        <button class="btn-access" onclick="changeFontSize('down')">A-</button>
        <button class="btn-access" onclick="changeFontSize('reset')">Reset</button>
      </div>
    </div>

    <!-- Dynamic content placeholder -->
    <div id="about-content" class="about-wrap">
      <div class="loading">Loading…</div>
    </div>

    <div id="cm-footer-slot"></div>
  </main>
</div>

<!-- JSON data embedded in script -->

<!-- JavaScript rendering logic -->
<script>
  // Load user name from localStorage
  const savedName = localStorage.getItem('activeUser') || "Guest";
    document.getElementById('user-display-name').innerText = savedName;
    document.getElementById('user-initials').innerText = savedName.charAt(0).toUpperCase();


    (function(){
  // Icons dictionary
  var ICONS = {
    heart:  '<svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>',
    shield: '<svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>',
    users:  '<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5"/><circle cx="17" cy="9" r="2"/></svg>',
    book:   '<svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2z"/><path d="M8 7h8M8 11h8"/></svg>'
  };

  // Render function builds HTML dynamically
  function render(d){
    var initials = function(n){return n.split(' ').map(function(p){return p[0]}).join('').slice(0,2).toUpperCase();};
    var html = ''+
      '<section class="hero"><h3>'+d.hero.title+'</h3><p>'+d.hero.body+'</p></section>'+
      '<div class="grid-2">'+
        d.info.map(function(i){
          return '<div class="cm-card info-card">'+
            '<h4><span class="ico">'+(ICONS[i.icon]||ICONS.heart)+'</span>'+i.title+'</h4>'+
            '<p>'+i.body+'</p></div>';
        }).join('')+
      '</div>'+
      '<section class="cm-card team-card">'+
        '<h4>Meet the Team</h4>'+
        '<div class="team-grid">'+
          d.team.map(function(m){
            return '<div class="member"><div class="avatar">'+initials(m.name)+'</div>'+
              '<p class="name">'+m.name+'</p>'+
              '<p class="role" style="font-weight: 600; color: #7a8a7c; margin: 4px 0 0;">'+m.matricNo+'</p>'+
              '<p class="role">'+m.role+'</p></div>';
          }).join('')+
        '</div>'+
      '</section>';
    document.getElementById('about-content').innerHTML = html;
  }

  // Fallback if JSON fails
  function fallback(){
    try{ render(JSON.parse(document.getElementById('about-data').textContent)); }
    catch(e){ document.getElementById('about-content').innerHTML='<div class="loading">Unable to load.</div>'; }
  }

  // AJAX request to load external JSON 
  var xhr = new XMLHttpRequest();
  xhr.open('GET','about.json',true);
  xhr.onreadystatechange = function(){
    if(xhr.readyState===4){
      if(xhr.status===200){
        try{ render(JSON.parse(xhr.responseText)); }catch(e){ fallback(); }
      } else { fallback(); }
    }
  };
  try{ xhr.send(); }catch(e){ fallback(); }
})();
</script>

<!--External scripts -->
<script src="footer.js"></script>
<script src="accessibility.js"></script>

</body>
</html>

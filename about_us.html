<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <title>About Us · CampusMind</title>
  <link rel="stylesheet" href="theme.css" />

  <style>

  .about-wrap{
    max-width:900px
  }

  .hero{
    background:linear-gradient(135deg,var(--cm-green) 0%,var(--cm-green-dark) 100%);
    color:#fff;border-radius:16px;padding:40px 36px;margin-bottom:24px;
    box-shadow:var(--cm-shadow);
  }

  .hero h3{
    margin:0 0 10px;font-size:24px
  }

  .hero p{
    margin:0;line-height:1.7;opacity:.95;max-width:680px
  }

  .grid-2{
    display:grid;grid-template-columns:1fr 1fr;gap:20px
  }

  .info-card{
    padding:24px
  }

  .info-card h4{
    margin:0 0 8px;font-size:17px;display:flex;align-items:center;gap:10px
  }

  .info-card .ico{
    width:34px;height:34px;border-radius:10px;background:var(--cm-green-soft);
    color:var(--cm-green-dark);display:inline-flex;align-items:center;justify-content:center;
  }

  .info-card .ico svg{
    width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2
  }

  .info-card p{
    margin:0;color:var(--cm-muted);line-height:1.65
  }

  .team-card{
    padding:24px;margin-top:24px
  }

  .team-card h4{
    margin:0 0 16px;font-size:17px
  }

  .team-grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:18px
  }

  .member{
    text-align:center;padding:16px;border:1px solid var(--cm-border);border-radius:12px
  }

  .member .avatar{
    width:64px;height:64px;border-radius:50%;margin:0 auto 10px;
    background:var(--cm-green-soft);color:var(--cm-green-dark);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;
  }

  .member .name{
    margin:0;font-weight:600;font-size:14px
  }

  .member .role{
    margin:2px 0 0;color:var(--cm-muted);font-size:12px
  }

  .loading{
    padding:30px;text-align:center;color:var(--cm-muted)
  }

  @media(max-width:990px){
    .grid-2{grid-template-columns:1fr}
    .team-grid{grid-template-columns:1fr 1fr}
  }
  
  @media(max-width:600px){
    .hero{padding:24px 20px}
    .hero h3{font-size:20px}
    .team-grid{grid-template-columns:1fr}
  }

  </style>
</head>

<body>

<div class="cm-app">
  <aside class="cm-sidebar">
    <h1 class="cm-brand">CampusMind</h1>
    <p class="cm-brand-sub">Student Mental Wellness</p>
    <div class="cm-user">
      <div class="cm-avatar" id="user-initials">U</div>
            <div>
                <div class="cm-uname" id="user-display-name">User</div>
                <div class="cm-urole">Undergraduate</div>
            </div>
    </div>

    <nav class="cm-nav">
      <a href="dashboard.html"><svg viewBox="0 0 24 24"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>Dashboard</a>
      <a href="daily_tasks.html"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 12l3 3 5-6"/></svg>Daily Tasks</a>
      <a href="resource_library.html"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2z"/><path d="M8 7h8M8 11h8"/></svg>Resources</a>
      <a href="support.html"><svg viewBox="0 0 24 24"><path d="M22 16.92V21a1 1 0 0 1-1.11 1A19 19 0 0 1 2 4.11 1 1 0 0 1 3 3h4.09a1 1 0 0 1 1 .75l1 4a1 1 0 0 1-.29 1L7 10.5a16 16 0 0 0 6.5 6.5l1.75-1.79a1 1 0 0 1 1-.29l4 1a1 1 0 0 1 .75 1z"/></svg>Support</a>
      <a href="about_us.html" class="active"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5"/><circle cx="17" cy="9" r="2"/><path d="M15 20c0-2 2-4 5-4"/></svg>About Us</a>
    </nav>

    <a href="index.html" class="cm-logout" onclick="localStorage.removeItem('activeUser');">
      <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      Log out
    </a>
  </aside>

  <main class="cm-main">
    <h2 class="cm-page-title">About Us</h2>
    <p class="cm-page-sub">Empowering IIUM students to take charge of their mental wellness.</p>

    <div id="about-content" class="about-wrap">
      <div class="loading">Loading…</div>
    </div>

    <div id="cm-footer-slot"></div>
  </main>
</div>

<script id="about-data" type="application/json">
{
  "hero": {
    "title": "Our Mission",
    "body": "CampusMind is a student-led initiative at IIUM that supports your mental wellness journey through daily self-care tasks, curated resources, and easy access to professional help. We believe every student deserves a calm mind and a place to turn to when things feel heavy."
  },
  "info": [
    { "icon": "heart",  "title": "Our Vision",  "body": "A campus where every student feels seen, supported, and equipped with tools to thrive academically and emotionally." },
    { "icon": "shield", "title": "Our Values",  "body": "Compassion, confidentiality, inclusivity, and evidence-based care guide everything we do." },
    { "icon": "users",  "title": "Who We Help", "body": "All IIUM students from undergraduate, postgraduate, local and international across every campus." },
    { "icon": "book",   "title": "What We Do",  "body": "We provide self-help resources, wellness tracking, and direct lines to IIUM's counseling services." }
  ],
  "team": [
    { "name": "Athirah Ayunni",  "role": "Project Leader & Developer" },
    { "name": "Amirah Haziqah",         "role": "Frontend Developer" },
    { "name": "Anis Jazmina",        "role": "Backend Developer" }
  ]
}
</script>

<script>
  const savedName = localStorage.getItem('activeUser') || "Guest";
    document.getElementById('user-display-name').innerText = savedName;
    document.getElementById('user-initials').innerText = savedName.charAt(0).toUpperCase();

(function(){
  var ICONS = {
    heart:  '<svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>',
    shield: '<svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>',
    users:  '<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5"/><circle cx="17" cy="9" r="2"/></svg>',
    book:   '<svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2z"/><path d="M8 7h8M8 11h8"/></svg>'
  };

  function render(d){
    var initials = function(n){return n.split(' ').map(function(p){return p[0]}).join('').slice(0,2).toUpperCase();};
    var html = ''+
      '<section class="hero"><h3>'+d.hero.title+'</h3><p>'+d.hero.body+'</p></section>'+
      '<div class="grid-2">'+
        d.info.map(function(i){
          return '<div class="cm-card info-card">'+
            '<h4><span class="ico">'+(ICONS[i.icon]||ICONS.heart)+'</span>'+i.title+'</h4>'+
            '<p>'+i.body+'</p></div>';
        }).join('')+
      '</div>'+
      '<section class="cm-card team-card">'+
        '<h4>Meet the Team</h4>'+
        '<div class="team-grid">'+
          d.team.map(function(m){
            return '<div class="member"><div class="avatar">'+initials(m.name)+'</div>'+
              '<p class="name">'+m.name+'</p><p class="role">'+m.role+'</p></div>';
          }).join('')+
        '</div>'+
      '</section>';
    document.getElementById('about-content').innerHTML = html;
  }

  function fallback(){
    try{ render(JSON.parse(document.getElementById('about-data').textContent)); }
    catch(e){ document.getElementById('about-content').innerHTML='<div class="loading">Unable to load.</div>'; }
  }

  var xhr = new XMLHttpRequest();
  xhr.open('GET','about.json',true);
  xhr.onreadystatechange = function(){
    if(xhr.readyState===4){
      if(xhr.status===200){
        try{ render(JSON.parse(xhr.responseText)); }catch(e){ fallback(); }
      } else { fallback(); }
    }
  };
  try{ xhr.send(); }catch(e){ fallback(); }
})();
</script>

<script src="footer.js"></script>

</body>
</html>

<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Dashboard · CampusMind</title>
    <link rel="stylesheet" href="theme.css" />
    <style>
        .dashboard-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-top: 24px;
        }
        .cm-card {
            background: #fff;
            border: 1px solid var(--cm-border);
            border-radius: 14px;
            padding: 24px;
            box-shadow: var(--cm-shadow);
        }
        .welcome-section { margin-bottom: 30px; }
        .welcome-section h1 { font-size: 28px; font-weight: 800; color: var(--cm-text); margin: 0; }
        .welcome-section p { color: var(--cm-muted); margin: 5px 0 0; }
        .stress-box {
            background: #f0fdf4;
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
            text-align: center;
        }
        .stress-value {
            font-size: 24px;
            font-weight: 800;
            color: var(--cm-green-dark);
            display: block;
            margin-bottom: 10px;
        }
        .btn-main {
            background: var(--cm-green);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 10px;
            width: 100%;
            font-weight: 700;
            cursor: pointer;
        }
        @media(max-width: 900px) {
            .dashboard-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="cm-app">
    <aside class="cm-sidebar">
        <h1 class="cm-brand">CampusMind</h1>
        <p class="cm-brand-sub">Student Mental Wellness</p>
        <div class="cm-user">
            <div class="cm-avatar">AJ</div>
            <div>
                <div class="cm-uname">AJ</div>
                <div class="cm-urole">Undergraduate</div>
            </div>
        </div>
        <nav class="cm-nav">
            <a href="dashboard.html" class="active"><svg viewBox="0 0 24 24"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>Dashboard</a>
            <a href="dailytasks.html"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 12l3 3 5-6"/></svg>Daily Tasks</a>
            <a href="resource-library.html"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2z"/><path d="M8 7h8M8 11h8"/></svg>Resources</a>
            <a href="support.html"><svg viewBox="0 0 24 24"><path d="M22 16.92V21a1 1 0 0 1-1.11 1A19 19 0 0 1 2 4.11 1 1 0 0 1 3 3h4.09a1 1 0 0 1 1 .75l1 4a1 1 0 0 1-.29 1L7 10.5a16 16 0 0 0 6.5 6.5l1.75-1.79a1 1 0 0 1 1-.29l4 1a1 1 0 0 1 .75 1z"/></svg>Support</a>
            <a href="about_us.html"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5"/><circle cx="17" cy="9" r="2"/><path d="M15 20c0-2 2-4 5-4"/></svg>About Us</a>
        </nav>
        <a href="index.html" class="cm-logout">
            <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
            Log out
        </a>
    </aside>

    <main class="cm-main">
        <div class="welcome-section">
            <h1>Welcome back, AJ!</h1>
            <p>Here's your mental wellness overview for today</p>
        </div>

        <div class="dashboard-grid">
            <div class="cm-card">
                <h3>Current Stress Level</h3>
                <p class="cm-muted">Based on your recent assessment</p>
                <div class="stress-box">
                    <span class="stress-value" id="dash-level">NO DATA</span>
                </div>
                <button class="btn-main" onclick="location.href='screening.html'" style="background: white; color: var(--cm-green); border: 1px solid var(--cm-border);">
                    Retake Assessment
                </button>
            </div>

            <div class="cm-card">
                <h3>Task Progress</h3>
                <p class="cm-muted">Your 21-day wellness journey</p>
                <div style="margin: 20px 0;">
                    <span style="font-size: 32px; font-weight: 800;">0/21</span>
                    <div class="bar" style="height:8px; background:#c9efde; border-radius:999px; overflow:hidden; margin-top:10px;">
                        <span style="display:block; height:100%; width:0%; background:var(--cm-green);"></span>
                    </div>
                </div>
                <button class="btn-main" onclick="location.href='dailytasks.html'">View All Tasks</button>
            </div>
        </div>
    </main>
</div>
<script>
    const score = localStorage.getItem('userScore');
    const display = document.getElementById('dash-level');
    if(score !== null) {
        const s = parseInt(score);
        if(s <= 4) display.innerText = "NORMAL";
        else if(s <= 8) display.innerText = "MILD";
        else display.innerText = "MODERATE";
    }
</script>
</body>
</html>

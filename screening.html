<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screening · CampusMind</title>
    
    <!-- Link to the global design system -->
    <link rel="stylesheet" href="theme.css" >
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* Specific layout styles for the DASS-21 questionnaire elements */
        .title-group h1 {
            font-size: 1.6em;
            font-weight: 700;
            color: #3d4a3e;
            margin: 0 0 5px 0;
        }

        .question-count {
            font-size: 0.85em;
            color: #7a8a7c;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: block;
            margin-bottom: 15px;
        }

        /* Progress Bar container styling */
        .progress-container {
            height: 6px;
            background: #dce4e0;
            border-radius: 999px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .progress-fill {
            display: block;
            height: 100%;
            background: var(--cm-green, #709677);
            transition: width 0.3s ease;
        }

        /* Question text block styling */
        .question-text {
            font-size: 1.15em;
            font-weight: 600;
            color: #3d4a3e;
            line-height: 1.5;
            margin: 0 0 30px 0;
            min-height: 60px;
        }

        /* Layout structure for the multiple choice choices */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        /* Option button style configurations */
        .option-btn {
            background: white;
            color: #3d4a3e;
            border: 1px solid #dce4e0;
            padding: 14px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95em;
            cursor: pointer;
            font-family: inherit;
            text-align: left;
            transition: all 0.2s ease;
            box-sizing: border-box;
            width: 100%;
        }

        .option-btn:hover {
            background-color: var(--cm-green-soft, #eafff5);
            border-color: var(--cm-green, #709677);
            color: var(--cm-green-dark, #5a7a60);
            padding-left: 20px; /* Micro-interaction sliding effect on hover */
        }

        .disclaimer {
            font-size: 0.75em;
            color: #7a8a7c;
            margin: 0;
            line-height: 1.4;
            border-top: 1px solid #f0f4f2;
            padding-top: 20px;
        }
    </style>
</head>
<body class="card-layout"> <!-- Uses card-layout class from style.css to vertically center the card -->

    <!-- Global Accessibility Control Component -->
    <div class="accessibility-container">
        <div class="accessibility-tools">
            <button class="btn-access" onclick="changeFontSize('up')" title="Increase text size">A+</button>
            <button class="btn-access" onclick="changeFontSize('down')" title="Decrease text size">A-</button>
            <button class="btn-access" onclick="changeFontSize('reset')">Reset</button>
        </div>
    </div>

    <!-- Main Screening Evaluation Card -->
    <div class="screening-card cm-main">
        <header class="header">
            <div class="title-group">
                <h1>DASS-21 Screening</h1>
                <span class="question-count" id="question-number">Question 1 of 21</span>
            </div>
            <div class="progress-container">
                <div class="progress-fill" id="progress-bar" style="width: 4.7%;"></div>
            </div>
        </header>

        <main class="content">
            <p class="question-text" id="question-display">Loading question...</p>

            <div class="options-list">
                <button class="option-btn" data-score="0">Never</button>
                <button class="option-btn" data-score="1">Rarely</button>
                <button class="option-btn" data-score="2">Often</button>
                <button class="option-btn" data-score="3">Very often</button>
            </div>
        </main>

        <footer>
            <p class="disclaimer">
                This screening is for informational purposes only and is not a diagnostic tool.
            </p>
        </footer>
    </div>

    <script>
        // Official DASS-21 question items grouped by category (s = stress, a = anxiety, d = depression)
        const questions = [
            { t: "I found it hard to wind down", c: "s" },
            { t: "I was aware of dryness of my mouth", c: "a" },
            { t: "I couldn't seem to experience any positive feeling at all", c: "d" },
            { t: "I experienced breathing difficulty", c: "a" },
            { t: "I found it difficult to work up the initiative to do things", c: "d" },
            { t: "I tended to over-react to situations", c: "s" },
            { t: "I experienced trembling (e.g. in the hands)", c: "a" },
            { t: "I felt that I was using a lot of nervous energy", c: "s" },
            { t: "I was worried about situations in which I might panic and make a fool of myself", c: "a" },
            { t: "I felt that I had nothing to look forward to", c: "d" },
            { t: "I found myself getting agitated", c: "s" },
            { t: "I found it difficult to relax", c: "s" },
            { t: "I felt down-hearted and blue", c: "d" },
            { t: "I was intolerant of anything that kept me from getting on with what I was doing", c: "s" },
            { t: "I felt I was close to panic", c: "a" },
            { t: "I was unable to become enthusiastic about anything", c: "d" },
            { t: "I felt I wasn't worth much as a person", c: "d" },
            { t: "I felt that I was rather touchy", c: "s" },
            { t: "I was aware of the action of my heart in the absence of physical exertion", c: "a" },
            { t: "I felt scared without any good reason", c: "a" },
            { t: "I felt that life was meaningless", c: "d" }
        ];

        let currentIndex = 0;
        let scores = { d: 0, a: 0, s: 0 };

        const questionDisplay = document.getElementById('question-display');
        const questionNumber = document.getElementById('question-number');
        const progressBar = document.getElementById('progress-bar');
        const buttons = document.querySelectorAll('.option-btn');


        // Updates the user interface state for questions numbers, text, and active progress
        function updateQuestion() {
            questionDisplay.innerText = questions[currentIndex].t;
            questionNumber.innerText = `Question ${currentIndex + 1} of 21`;
            progressBar.style.width = ((currentIndex + 1) / questions.length * 100) + "%";
        }

        // Click event handler attached to user choice response buttons
        buttons.forEach(button => {
            button.addEventListener('click', () => {
                // Increment score counter specific to current question category trait
                scores[questions[currentIndex].c] += parseInt(button.getAttribute('data-score'));
                currentIndex++;
                
                if (currentIndex < questions.length) {
                    updateQuestion();
                } else {
                    // Compute final DASS-21 metrics (Scale calculation factor requires doubling raw scores)
                    const finalResults = { d: scores.d * 2, a: scores.a * 2, s: scores.s * 2 };
                    localStorage.setItem('dass_results', JSON.stringify(finalResults));
                    window.location.href = "status.html";
                }
            });
        });
        
        // Render initial test query payload immediately on page load initialization
        updateQuestion();
    </script>
    <script src=accessibility.js></script>
</body>
</html>

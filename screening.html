<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screening · CampusMind</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="screening-card">
        <div class="header">
            <div class="title-group">
                <h1>DASS-21 Screening</h1>
                <span class="question-count" id="question-number">Question 1 of 21</span>
            </div>
            <div class="progress-container">
                <div class="progress-fill" id="progress-bar" style="width: 4.7%;"></div>
            </div>
        </div>

        <main class="content">
            <p class="question-text" id="question-display">Loading question...</p>

            <div class="options-list">
                <button class="option-btn" data-score="0">Never</button>
                <button class="option-btn" data-score="1">Rarely</button>
                <button class="option-btn" data-score="2">Often</button>
                <button class="option-btn" data-score="3">Very often</button>
            </div>
        </main>

        <footer>
            <p class="disclaimer">
                This screening is for informational purposes only and is not a diagnostic tool.
            </p>
        </footer>
    </div>

    <script>
        const questions = [
            { t: "I found it hard to wind down", c: "s" },
            { t: "I was aware of dryness of my mouth", c: "a" },
            { t: "I couldn't seem to experience any positive feeling at all", c: "d" },
            { t: "I experienced breathing difficulty", c: "a" },
            { t: "I found it difficult to work up the initiative to do things", c: "d" },
            { t: "I tended to over-react to situations", c: "s" },
            { t: "I experienced trembling (e.g. in the hands)", c: "a" },
            { t: "I felt that I was using a lot of nervous energy", c: "s" },
            { t: "I was worried about situations in which I might panic and make a fool of myself", c: "a" },
            { t: "I felt that I had nothing to look forward to", c: "d" },
            { t: "I found myself getting agitated", c: "s" },
            { t: "I found it difficult to relax", c: "s" },
            { t: "I felt down-hearted and blue", c: "d" },
            { t: "I was intolerant of anything that kept me from getting on with what I was doing", c: "s" },
            { t: "I felt I was close to panic", c: "a" },
            { t: "I was unable to become enthusiastic about anything", c: "d" },
            { t: "I felt I wasn't worth much as a person", c: "d" },
            { t: "I felt that I was rather touchy", c: "s" },
            { t: "I was aware of the action of my heart in the absence of physical exertion", c: "a" },
            { t: "I felt scared without any good reason", c: "a" },
            { t: "I felt that life was meaningless", c: "d" }
        ];

        let currentIndex = 0;
        let scores = { d: 0, a: 0, s: 0 };

        const questionDisplay = document.getElementById('question-display');
        const questionNumber = document.getElementById('question-number');
        const progressBar = document.getElementById('progress-bar');
        const buttons = document.querySelectorAll('.option-btn');

        function updateQuestion() {
            questionDisplay.innerText = questions[currentIndex].t;
            questionNumber.innerText = `Question ${currentIndex + 1} of 21`;
            progressBar.style.width = ((currentIndex + 1) / questions.length * 100) + "%";
        }

        buttons.forEach(button => {
            button.addEventListener('click', () => {
                scores[questions[currentIndex].c] += parseInt(button.getAttribute('data-score'));
                currentIndex++;
                if (currentIndex < questions.length) {
                    updateQuestion();
                } else {
                    const finalResults = { d: scores.d * 2, a: scores.a * 2, s: scores.s * 2 };
                    localStorage.setItem('dass_results', JSON.stringify(finalResults));
                    window.location.href = "status.html";
                }
            });
        });
        updateQuestion();
    </script>
</body>
</html>

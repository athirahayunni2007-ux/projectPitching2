<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DASS-21 Screening · CampusMind</title>
    <link rel="stylesheet" href="theme.css">
    <style>
        body {
            background-color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: inherit;
        }
        .screening-card {
            background: #fff;
            border: 1px solid var(--cm-border);
            border-radius: 14px;
            padding: 40px;
            box-shadow: var(--cm-shadow);
            max-width: 600px;
            width: 90%;
            text-align: center;
        }
        .header h1 { font-size: 24px; margin-bottom: 5px; color: var(--cm-text); }
        .question-count { color: var(--cm-muted); font-size: 14px; }
        .progress-container {
            background: #e2e8f0;
            height: 8px;
            border-radius: 4px;
            margin: 20px 0 30px;
        }
        .progress-fill {
            background: var(--cm-green);
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s;
        }
        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 25px;
            color: var(--cm-text);
            min-height: 80px;
            line-height: 1.4;
        }
        .options-list { display: grid; gap: 10px; }
        .option-btn {
            padding: 12px;
            border: 1px solid var(--cm-border);
            border-radius: 10px;
            background: #fff;
            cursor: pointer;
            font-weight: 500;
            font-size: 15px;
            transition: all 0.2s;
            text-align: left;
        }
        .option-btn:hover {
            border-color: var(--cm-green);
            background: #f0fdf4;
        }
        .instruction { font-size: 13px; color: var(--cm-muted); margin-bottom: 20px; font-style: italic; }
    </style>
</head>
<body>

    <div class="screening-card">
        <div class="header">
            <h1>DASS-21 Assessment</h1>
            <span class="question-count" id="question-number">Question 1 of 21</span>
            <div class="progress-container">
                <div class="progress-fill" id="progress-bar" style="width: 4.7%;"></div>
            </div>
        </div>

        <p class="instruction">Did applied to you over the past week:</p>
        <p class="question-text" id="question-display">Loading question...</p>

        <div class="options-list">
            <button class="option-btn" data-score="0">0 - Did not apply to me at all</button>
            <button class="option-btn" data-score="1">1 - Applied to me to some degree</button>
            <button class="option-btn" data-score="2">2 - Applied to me to a considerable degree</button>
            <button class="option-btn" data-score="3">3 - Applied to me very much</button>
        </div>
    </div>

<script>
    const questions = [
        { t: "I found it hard to wind down", c: "s" },
        { t: "I was aware of dryness of my mouth", c: "a" },
        { t: "I couldn't seem to experience any positive feeling at all", c: "d" },
        { t: "I experienced breathing difficulty", c: "a" },
        { t: "I found it difficult to work up the initiative to do things", c: "d" },
        { t: "I tended to over-react to situations", c: "s" },
        { t: "I experienced trembling (e.g. in the hands)", c: "a" },
        { t: "I felt that I was using a lot of nervous energy", c: "s" },
        { t: "I was worried about situations in which I might panic and make a fool of myself", c: "a" },
        { t: "I felt that I had nothing to look forward to", c: "d" },
        { t: "I found myself getting agitated", c: "s" },
        { t: "I found it difficult to relax", c: "s" },
        { t: "I felt down-hearted and blue", c: "d" },
        { t: "I was intolerant of anything that kept me from getting on with what I was doing", c: "s" },
        { t: "I felt I was close to panic", c: "a" },
        { t: "I was unable to become enthusiastic about anything", c: "d" },
        { t: "I felt I wasn't worth much as a person", c: "d" },
        { t: "I felt that I was rather touchy", c: "s" },
        { t: "I was aware of the action of my heart in the absence of physical exertion", c: "a" },
        { t: "I felt scared without any good reason", c: "a" },
        { t: "I felt that life was meaningless", c: "d" }
    ];

    let currentIndex = 0;
    let scores = { d: 0, a: 0, s: 0 };

    const questionDisplay = document.getElementById('question-display');
    const questionNumber = document.getElementById('question-number');
    const progressBar = document.getElementById('progress-bar');
    const buttons = document.querySelectorAll('.option-btn');

    function updateQuestion() {
        const q = questions[currentIndex];
        questionDisplay.innerText = q.t;
        questionNumber.innerText = `Question ${currentIndex + 1} of 21`;
        progressBar.style.width = ((currentIndex + 1) / questions.length * 100) + "%";
    }

    buttons.forEach(button => {
        button.addEventListener('click', () => {
            const points = parseInt(button.getAttribute('data-score'));
            const category = questions[currentIndex].c;
            
            scores[category] += points;
            currentIndex++;

            if (currentIndex < questions.length) {
                updateQuestion();
            } else {
                // Final score calculation: DASS-21 scores are multiplied by 2 
                const finalScores = {
                    depression: scores.d * 2,
                    anxiety: scores.a * 2,
                    stress: scores.s * 2
                };
                localStorage.setItem('dass_results', JSON.stringify(finalScores));
                window.location.href = "status.html";
            }
        });
    });

    updateQuestion();
</script>
</body>
</html>

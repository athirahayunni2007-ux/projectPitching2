<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusMind</title>
    <link rel = "stylesheet" href = "authentification.css">
</head>
<body>
    
<main class="auth-container">
    <div class ="welcome">
        <h1>Welcome Back!</h1>
        <h3>Sign in to continue your wellness journey</h3>

        <label for = "loginEmail">Email Address</label><br>
        <input type = "email" id ="email" name = "email" placeholder="your.email@example.com">
        <br><br>

        <label for = "password">Password</label><br>
        <input  type = "password" id="password" name ="password" placeholder="Enter your password">

        <div class="showPasswordArea">
        <input type ="checkbox" id="showPassword" onclick="showPassword()">
        <label for="showPassword">Show password</label>
        </div>

        <br><br>
        <button onclick="login()">Sign in</button>

        <p>Don't have an account?
        <a href = "signup.html">Sign Up</a></p>
    </div>
    </main><div id="cm-footer-slot"></div>

    <script src = "authentification.js"></script>
    <script src="footer.js"></script>

</body>
</html>

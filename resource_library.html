<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Resource Library · CampusMind</title>
<link rel="stylesheet" href="theme.css" />
<style>
  .toolbar{
    display:flex;flex-wrap:wrap;gap:12px;align-items:center;
    margin-bottom:18px;
  }
  .toolbar input, .toolbar select{
    padding:10px 12px;border:1px solid var(--cm-border);border-radius:10px;
    font-size:14px;background:#fff;font-family:inherit;
  }
  .toolbar input{flex:1;min-width:220px}
  .cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .cat-btn{
    padding:8px 14px;border-radius:999px;border:1px solid var(--cm-border);
    background:#fff;cursor:pointer;font-size:13px;font-family:inherit;font-weight:500;
  }
  .cat-btn.active{background:var(--cm-green);color:#fff;border-color:var(--cm-green)}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  @media(max-width:990px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:600px){.grid{grid-template-columns:1fr}}
  .item{padding:18px}
  .type-badge{
    display:inline-block;padding:3px 10px;border-radius:999px;
    font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;
    background:var(--cm-green-soft);color:var(--cm-green-dark);margin-bottom:10px;
  }
  .item h4{margin:0 0 6px;font-size:16px}
  .item p{margin:0 0 12px;color:var(--cm-muted);font-size:14px;line-height:1.5}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{
    font-size:12px;color:var(--cm-green-dark);background:#ecfdf5;
    padding:3px 8px;border-radius:6px;cursor:pointer;border:none;font-family:inherit;
  }
  .tag:hover{background:var(--cm-green-soft)}
  .empty{padding:40px;text-align:center;color:var(--cm-muted)}
</style>
</head>
<body>
<div class="cm-app">
  <aside class="cm-sidebar">
    <h1 class="cm-brand">CampusMind</h1>
    <p class="cm-brand-sub">Student Mental Wellness</p>
    <div class="cm-user">
      <div class="cm-avatar" id="user-initials">U</div>
            <div>
                <div class="cm-uname" id="user-display-name">User</div>
                <div class="cm-urole">Undergraduate</div>
            </div>
    </div>
    <nav class="cm-nav">
      <a href="dashboard.html"><svg viewBox="0 0 24 24"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>Dashboard</a>
      <a href="daily_tasks.html"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 12l3 3 5-6"/></svg>Daily Tasks</a>
      <a href="resource_library.html" class="active"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2z"/><path d="M8 7h8M8 11h8"/></svg>Resources</a>
      <a href="support.html"><svg viewBox="0 0 24 24"><path d="M22 16.92V21a1 1 0 0 1-1.11 1A19 19 0 0 1 2 4.11 1 1 0 0 1 3 3h4.09a1 1 0 0 1 1 .75l1 4a1 1 0 0 1-.29 1L7 10.5a16 16 0 0 0 6.5 6.5l1.75-1.79a1 1 0 0 1 1-.29l4 1a1 1 0 0 1 .75 1z"/></svg>Support</a>
      <a href="about_us.html"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5"/><circle cx="17" cy="9" r="2"/><path d="M15 20c0-2 2-4 5-4"/></svg>About Us</a>
    </nav>
    <a href="index.html" class="cm-logout" onclick="localStorage.removeItem('activeUser');">
      <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      Log out
    </a>
  </aside>

  <main class="cm-main">
    <h2 class="cm-page-title">Resource Library</h2>
    <p class="cm-page-sub">Browse articles, videos, and posters to support your wellness journey.</p>

    <div class="toolbar">
      <input id="search" type="text" placeholder="Search by title, description, or #tag…" />
      <select id="sort">
        <option value="az">Sort: A → Z</option>
        <option value="za">Sort: Z → A</option>
      </select>
    </div>

    <div class="cats" id="cats"></div>

    <div id="list" class="grid"><div class="empty">Loading resources…</div></div>

    <div id="cm-footer-slot"></div>
  </main>
</div>

<script id="resources-data" type="application/json">
{
  "materials": [
    { "id":"a1","type":"Articles","title":"Managing Exam Stress","description":"Practical tips for handling academic pressure.","tags":["stress","study","academic"] },
    { "id":"a2","type":"Articles","title":"Building Healthy Sleep Habits","description":"Why sleep matters for your mental health.","tags":["sleep","wellness"] },
    { "id":"a3","type":"Articles","title":"Mindful Eating on Campus","description":"Nutrition basics for busy students.","tags":["nutrition","mindfulness"] },
    { "id":"v1","type":"Videos","title":"5-Minute Breathing Exercise","description":"A quick guided breathing session.","tags":["breathing","calm"] },
    { "id":"v2","type":"Videos","title":"Yoga for Beginners","description":"Gentle stretches you can do at your desk.","tags":["yoga","movement"] },
    { "id":"v3","type":"Videos","title":"Talking About Mental Health","description":"How to open up to friends and family.","tags":["communication","support"] },
    { "id":"p1","type":"Posters","title":"Daily Self-Care Checklist","description":"Printable poster for your dorm wall.","tags":["selfcare","printable"] },
    { "id":"p2","type":"Posters","title":"Grounding 5-4-3-2-1 Technique","description":"Visual guide for anxiety relief.","tags":["anxiety","grounding"] },
    { "id":"p3","type":"Posters","title":"Emergency Helplines IIUM","description":"Keep these numbers handy.","tags":["emergency","helpline"] }
  ]
}
</script>

<script>
    const savedName = localStorage.getItem('activeUser') || "Guest";
    document.getElementById('user-display-name').innerText = savedName;
    document.getElementById('user-initials').innerText = savedName.charAt(0).toUpperCase();
    

(function(){
  var FALLBACK = JSON.parse(document.getElementById('resources-data').textContent);
  var state = { materials:[], category:'All', search:'', sort:'az' };
  var CATEGORIES = ['All','Articles','Videos','Posters'];

  function loadResources(){
    var xhr = new XMLHttpRequest();
    xhr.open('GET','resources.json',true);
    xhr.onreadystatechange = function(){
      if(xhr.readyState===4){
        try{
          if((xhr.status===200||xhr.status===0) && xhr.responseText){
            state.materials = JSON.parse(xhr.responseText).materials;
          } else { state.materials = FALLBACK.materials; }
        } catch(e){ state.materials = FALLBACK.materials; }
        renderCats(); render();
      }
    };
    try{ xhr.send(); } catch(e){ state.materials = FALLBACK.materials; renderCats(); render(); }
  }

  function renderCats(){
    var c = document.getElementById('cats');
    c.innerHTML = CATEGORIES.map(function(cat){
      return '<button class="cat-btn'+(cat===state.category?' active':'')+'" data-cat="'+cat+'">'+cat+'</button>';
    }).join('');
    c.querySelectorAll('.cat-btn').forEach(function(b){
      b.addEventListener('click', function(){ state.category=b.dataset.cat; renderCats(); render(); });
    });
  }

  function render(){
    var q = state.search.trim().toLowerCase().replace(/^#/,'');
    var items = state.materials.filter(function(m){
      if(state.category!=='All' && m.type!==state.category) return false;
      if(!q) return true;
      return m.title.toLowerCase().indexOf(q)>-1
          || m.description.toLowerCase().indexOf(q)>-1
          || (m.tags||[]).some(function(t){return t.toLowerCase().indexOf(q)>-1});
    });
    items.sort(function(a,b){
      return state.sort==='az' ? a.title.localeCompare(b.title) : b.title.localeCompare(a.title);
    });
    var list = document.getElementById('list');
    if(!items.length){ list.innerHTML = '<div class="empty">No materials found.</div>'; return; }
    list.innerHTML = items.map(function(m){
      return '<div class="cm-card item">'
        + '<span class="type-badge">'+m.type+'</span>'
        + '<h4>'+m.title+'</h4>'
        + '<p>'+m.description+'</p>'
        + '<div class="tags">'+(m.tags||[]).map(function(t){return '<button class="tag" data-tag="'+t+'">#'+t+'</button>';}).join('')+'</div>'
        + '</div>';
    }).join('');
    list.querySelectorAll('.tag').forEach(function(t){
      t.addEventListener('click', function(){
        document.getElementById('search').value = '#'+t.dataset.tag;
        state.search = '#'+t.dataset.tag; render();
      });
    });
  }

  document.getElementById('search').addEventListener('input', function(e){ state.search=e.target.value; render(); });
  document.getElementById('sort').addEventListener('change', function(e){ state.sort=e.target.value; render(); });

  loadResources();
})();
</script>
<script src="footer.js"></script>
</body>
</html>

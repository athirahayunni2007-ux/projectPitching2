<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Resource Library · CampusMind</title>
  <link rel="stylesheet" href="theme.css"/>

<style>
  body {
    font-size: 16px;
    transition: font-size 0.2s ease;
  }

  .header-container {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 6px;
  }

  .accessibility-tools {
    display: flex;
    gap: 6px;
    background: #fff;
    padding: 4px;
    border-radius: 8px;
    border: 1px solid #cbd5e1;
    box-shadow: 0 2px 4px rgb(0 0 0 / 0.05);
  }

  .btn-access {
    background: transparent;
    border: none;
    color: #334155;
    padding: 6px 12px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    border-radius: 6px;
    transition: all 0.1s;
  }

  .btn-access:hover {
    background: #eafff5;
    color: #0f766e;
  }

  .toolbar{
    display:flex;flex-wrap:wrap;gap:12px;align-items:center;
    margin-bottom:18px;
  }

  .toolbar input, .toolbar select{
    padding:10px 12px;border:1px solid var(--cm-border);border-radius:10px;
    font-size:14px;background:#fff;font-family:inherit;
  }

  .toolbar input{
    flex:1;min-width:220px
  }

  .cats{
    display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px
  }

  .cat-btn{
    padding:8px 14px;border-radius:999px;border:1px solid var(--cm-border);
    background:#fff;cursor:pointer;font-size:13px;font-family:inherit;font-weight:500;
  }

  .cat-btn.active{
    background:var(--cm-green);color:#fff;border-color:var(--cm-green)
  }

  .grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:18px
  }

  @media(max-width:990px){
    .grid{grid-template-columns:repeat(2,1fr)}
  }

  @media(max-width:600px){
    .grid{grid-template-columns:1fr}
    .header-container {
      flex-direction: column-reverse;
      gap: 15px;
      align-items: flex-end;
    }
  }

  .item{
    padding:18px;
    cursor:pointer;
  }

  .type-badge{
    display:inline-block;padding:3px 10px;border-radius:999px;
    font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;
    background:var(--cm-green-soft);color:var(--cm-green-dark);margin-bottom:10px;
  }

  .item h4{
    margin:0 0 6px;font-size:16px
  }

  .item p{
    margin:0 0 12px;color:var(--cm-muted);font-size:14px;line-height:1.5
  }

  .tags{
    display:flex;flex-wrap:wrap;gap:6px
  }

  .tag{
    font-size:12px;color:var(--cm-green-dark);background:#ecfdf5;
    padding:3px 8px;border-radius:6px;cursor:pointer;border:none;font-family:inherit;
  }

  .tag:hover{
    background:var(--cm-green-soft)
  }

  .empty{
    padding:40px;text-align:center;color:var(--cm-muted)
  }

    .modal {
  position: fixed; top:0; left:0; width:100%; height:100%;
  background: rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center;
}
.modal-content {
  background:#fff; padding:20px; border-radius:8px; max-width:600px; width:90%;
}
#modal-close {
  float:right; font-size:24px; cursor:pointer;
}

#modal-close {
  float:right; font-size:24px; cursor:pointer;
}

</style>
</head>

<body>

<div class="cm-app">
  <aside class="cm-sidebar">
    <h1 class="cm-brand">CampusMind</h1>
    <p class="cm-brand-sub">Student Mental Wellness</p>
    <div class="cm-user">
      <div class="cm-avatar" id="user-initials">U</div>
      <div>
        <div class="cm-uname" id="user-display-name">User</div>
        <div class="cm-urole">Undergraduate</div>
      </div>
    </div>

    <nav class="cm-nav">
      <a href="dashboard.html"><svg viewBox="0 0 24 24"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>Dashboard</a>
      <a href="daily_tasks.html"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 12l3 3 5-6"/></svg>Daily Tasks</a>
      <a href="resource_library.html" class="active"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2z"/><path d="M8 7h8M8 11h8"/></svg>Resources</a>
      <a href="support.html"><svg viewBox="0 0 24 24"><path d="M22 16.92V21a1 1 0 0 1-1.11 1A19 19 0 0 1 2 4.11 1 1 0 0 1 3 3h4.09a1 1 0 0 1 1 .75l1 4a1 1 0 0 1-.29 1L7 10.5a16 16 0 0 0 6.5 6.5l1.75-1.79a1 1 0 0 1 1-.29l4 1a1 1 0 0 1 .75 1z"/></svg>Support</a>
      <a href="about_us.html"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5"/><circle cx="17" cy="9" r="2"/><path d="M15 20c0-2 2-4 5-4"/></svg>About Us</a>
    </nav>

    <a href="index.html" class="cm-logout" onclick="localStorage.removeItem('activeUser');">
      <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      Log out
    </a>
  </aside>

  <main class="cm-main">
    <div class="header-container">
      <div>
        <h2 class="cm-page-title">Resource Library</h2>
        <p class="cm-page-sub">Browse videos, e-books and posters to support your wellness journey.</p>
      </div>
      <div class="accessibility-tools">
        <button class="btn-access" onclick="changeFontSize('up')" title="Besarkan tulisan">A+</button>
        <button class="btn-access" onclick="changeFontSize('down')" title="Kecilkan tulisan">A-</button>
      </div>
    </div>

    <div class="toolbar">
      <input id="search" type="text" placeholder="Search by title, description, or #tag…" />
      <select id="sort">
        <option value="az">Sort: A → Z</option>
        <option value="za">Sort: Z → A</option>
      </select>
    </div>

    <div class="cats" id="cats"></div>

    <div id="list" class="grid"><div class="empty">Loading resources…</div></div>

    <div id="cm-footer-slot"></div>
  </main>
</div>

<script id="resources-data" type="application/json">
{
  "materials": [
    { "id":"e1","type":"E-Books","title":"Suicide Prevention Kit","description":"Collection of items designed to help individuals remember their reasons to keep living.","tags":["kit","suicide"] },
    { "id":"e2","type":"E-Books","title":"Campus Survival Kit","description":"Why campus preparation and survival skill is important for your mental health.","tags":["campus","kit"] },
    { "id":"e3","type":"E-Books","title":"IIUM Student Mental Health Policy 2021","description":"IIUM views an individual with good mental health as someone who displays the characteristics of Insan Sejahtera","tags":["sejahtera","policy"] },
    { "id":"e4","type":"E-Books","title":"Mental Health Tips for Students","description":"Practical advice for maintaining good mental health during your free time.","tags":["mental health","tips"] },
    { "id":"v1","type":"Videos","title":"Podcast Bicara Sihat: \"Bukan Sekadar Sedih\" - Memahami Depresi","description":"Remember, seeking help is a strength, not a weakness.","tags":["depression","podcast"] },
    { "id":"v2","type":"Videos","title":"What's on Your Mind? | UNICEF","description":"Opening up about your struggles with someone you trust can help you feel better. #OnYourMind","tags":["depression","struggles"] },
    { "id":"v3","type":"Videos","title":"Patient Story On Recovering From Mental Health Illness","description":"What’s the best way to remove the stigma around mental health and suicide ideation? Talk openly about our own stories.","tags":["communication","support"] },
    { "id":"p1","type":"Posters","title":"LIVE LIFE","description":"WHO initiative to support countries to advance political will, national strategic action, and serve as a catalyst for governments to take evidence-based action to prevent suicide.","tags":["WHO","government"] },
    { "id":"p2","type":"Posters","title":"Talian Sokongan Psikososial","description":"services that respond to calls and crises related to mental health, suicidal behavior, self-harm or harm to others, as well as post-vention and follow-up calls in the community.","tags":["helpline","support"] }
  ]
}
</script>

<script>
    const savedName = localStorage.getItem('activeUser') || "Guest";
    document.getElementById('user-display-name').innerText = savedName;
    document.getElementById('user-initials').innerText = savedName.charAt(0).toUpperCase();
    
    let currentScale = 100;

    function applyDynamicFontScaling() {
        const mainContent = document.querySelector('.cm-main');
        if (mainContent) {
            const dynamicTexts = mainContent.querySelectorAll('h2, h3, h4, p, span, input, select, button, li');
            dynamicTexts.forEach(el => {
                if (!el.classList.contains('btn-access')) {
                    el.style.fontSize = (currentScale / 100) + 'em';
                }
            });
        }
        const sidebar = document.querySelector('.cm-sidebar');
        if (sidebar) {
            const sidebarTexts = sidebar.querySelectorAll('.cm-uname, .cm-urole, .cm-brand, .cm-brand-sub, .cm-nav a, .cm-logout, .cm-avatar');
            sidebarTexts.forEach(el => {
                el.style.fontSize = (currentScale / 100) + 'em';
            });
        }
        const footerSlot = document.getElementById('cm-footer-slot');
        if (footerSlot) {
            const footerTexts = footerSlot.querySelectorAll('.cm-footer h4, .cm-footer h5, .cm-footer p, .cm-footer a, .cm-footer li');
            footerTexts.forEach(el => {
                el.style.fontSize = (currentScale / 100) + 'em';
            });
        }
    }

    function changeFontSize(action) {
        if (action === 'up') {
            if (currentScale < 150) currentScale += 15;
        } else {
            if (currentScale > 100) currentScale -= 15;
        }
        document.body.style.fontSize = currentScale + '%';
        applyDynamicFontScaling();
    }

(function(){
  var FALLBACK = JSON.parse(document.getElementById('resources-data').textContent);
  var state = { materials:[], category:'All', search:'', sort:'az' };
  var CATEGORIES = ['All', 'E-Books', 'Videos', 'Posters'];

  function loadResources(){
    var xhr = new XMLHttpRequest();
    xhr.open('GET','resources.json',true);
    xhr.onreadystatechange = function(){
      if(xhr.readyState===4){
        try{
          if((xhr.status===200||xhr.status===0) && xhr.responseText){
            state.materials = JSON.parse(xhr.responseText).materials;
          } else { state.materials = FALLBACK.materials; }
        } catch(e){ state.materials = FALLBACK.materials; }
        renderCats(); render();
      }
    };
    try{ xhr.send(); } catch(e){ state.materials = FALLBACK.materials; renderCats(); render(); }
  }

  function renderCats(){
    var c = document.getElementById('cats');
    c.innerHTML = CATEGORIES.map(function(cat){
      return '<button class="cat-btn'+(cat===state.category?' active':'')+'" data-cat="'+cat+'">'+cat+'</button>';
    }).join('');
    c.querySelectorAll('.cat-btn').forEach(function(b){
      b.addEventListener('click', function(){ state.category=b.dataset.cat; renderCats(); render(); });
    });
    applyDynamicFontScaling();
  }

  function render(){
    var q = state.search.trim().toLowerCase().replace(/^#/,'');
    var items = state.materials.filter(function(m){
      if(state.category!=='All' && m.type!==state.category) return false;
      if(!q) return true;
      return m.title.toLowerCase().indexOf(q)>-1
          || m.description.toLowerCase().indexOf(q)>-1
          || (m.tags||[]).some(function(t){return t.toLowerCase().indexOf(q)>-1});
    });

    items.sort(function(a,b){
      return state.sort==='az' ? a.title.localeCompare(b.title) : b.title.localeCompare(a.title);
    });

    var list = document.getElementById('list');
    if(!items.length){ list.innerHTML = '<div class="empty">No materials found.</div>'; applyDynamicFontScaling(); return; }
    
    list.innerHTML = items.map(function(m){
      return '<div class="cm-card item" data-id="'+m.id+'">'
        + '<span class="type-badge">'+m.type+'</span>'
        + '<h4>'+m.title+'</h4>'
        + '<p>'+m.description+'</p>'
        + '<div class="tags">'+(m.tags||[]).map(function(t){return '<button class="tag" data-tag="'+t+'">#'+t+'</button>';}).join('')+'</div>'
        + '</div>';
    }).join('');

    //click events for resources
    list.querySelectorAll('.item').forEach(function(card){
  card.addEventListener('click', function(){
    var id = card.dataset.id;
    var material = state.materials.find(function(m){ return m.id===id; });

    if(material){
      document.getElementById('modal-title').innerText = material.title;
      document.getElementById('modal-description').innerText = material.description;

      let extra = '';
      if(material.type === "E-Books"){
        if(material.id === "e1"){
          extra = '<iframe src="ebooks/Suicide_PreventionKit.pdf" width="100%" height="400"></iframe>'
                + '<p><a href="ebooks/Suicide_PreventionKit.pdf" target="_blank">Open in new tab</a></p>';
        }
        else if(material.id === "e2"){
          extra = '<iframe src="ebooks/Campus_SurvivalKit.pdf" width="100%" height="400"></iframe>'
                + '<p><a href="ebooks/Campus_SurvivalKit.pdf" target="_blank">Open in new tab</a></p>';
        }
        else if(material.id === "e3"){
          extra = '<iframe src="ebooks/IIUM_Policy2021.pdf" width="100%" height="400"></iframe>'
                + '<p><a href="ebooks/IIUM_Policy2021.pdf" target="_blank">Open in new tab</a></p>';
        }
        else if(material.id === "e4"){
          extra = '<iframe src="ebooks/MentalHealth_UKTips.pdf" width=100%" height="400"></iframe>'
                + '<p><a href="ebooks/MentalHealth_UKTips.pdf" target="_blank">Open in new tab</a></p>';
        }
      }
      else if(material.type === "Videos"){
        if(material.id === "v1"){
          extra = '<iframe width="100%" height="400" src="https://www.youtube.com/embed/8--GxE6E2so" frameborder="0" allowfullscreen></iframe>'
                + '<p><a href="https://youtu.be/8--GxE6E2so?si=ySHL9yO7KME_dZ9j" target="_blank">Open in new tab</a></p>';
        }
        else if(material.id === "v2"){
          extra = '<iframe width="560" height="315" src="https://www.youtube.com/embed/AzZpiZPxvq0?si=zTSdftVWkhfJN2ur" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>'
                + '<p><a href="https://www.youtube.com/embed/AzZpiZPxvq0?si=zTSdftVWkhfJN2ur" target="_blank">Open in new tab</a></p>';
        }
        else if(material.id === "v3"){
          extra = '<iframe width="560" height="315" src="https://www.youtube.com/embed/3BteSKlP92w?si=VEp86KPszlib2i2M" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>'
                + '<p><a href="https://www.youtube.com/embed/3BteSKlP92w?si=VEp86KPszlib2i2M" target="_blank">Open in new tab</a></p>';
        }
      }
      else if(material.type === "Posters"){
        if(material.id === "p1"){
          extra = '<img src="img/livelifeWHO.png" alt="Live Life by WHO" style="max-width:100%">'
                + '<p><a href="img/livelifeWHO.png" target="_blank">Open in new tab</a></p>';
      }
      else if(material.id === "p2"){
          extra = '<img src="img/taliansokonganpsikososial.png" alt="Talian Sokongan Psikososial KKM" style="max-width:70%">'
                + '<p><a href="img/taliansokonganpsikososial.png" target="_blank">Open in new tab</a></p>';
      } 
    }

      document.getElementById('modal-extra').innerHTML = extra;
      document.getElementById('material-modal').style.display = 'flex';
    }
  });
});


  //keep tag click logic after
    list.querySelectorAll('.tag').forEach(function(t){
      t.addEventListener('click', function(){
        document.getElementById('search').value = '#'+t.dataset.tag;
        state.search = '#'+t.dataset.tag; render();
      });
    });
    applyDynamicFontScaling();
  }

  document.getElementById('search').addEventListener('input', function(e){ state.search=e.target.value; render(); });
  document.getElementById('sort').addEventListener('change', function(e){ state.sort=e.target.value; render(); });

  loadResources();
})();
</script>

<script src="footer.js"></script>

<!-- open details of resource in modal -->
<div id="material-modal" class="modal" style="display:none;">
  <div class="modal-content">
    <span id="modal-close">&times;</span>
    <h3 id="modal-title"></h3>
    <p id="modal-description"></p>
    <div id="modal-extra"></div>
  </div>
</div>

<!-- close details of resource in modal -->
<script>
  document.getElementById('modal-close').addEventListener('click', function(){
    document.getElementById('material-modal').style.display = 'none';
  });
</script>

</body>
</html>

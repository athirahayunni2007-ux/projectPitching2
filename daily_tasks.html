<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Daily Tasks · CampusMind</title>
<link rel="stylesheet" href="theme.css" />
<style>
  /* === Daily Tasks page === */
  .progress-card{
    background:#eafff5;
    border:1px solid #b7ebd5;
    border-radius:14px;
    padding:22px 26px;
    margin-bottom:24px;
    display:flex;flex-direction:column;gap:14px;
    box-shadow:var(--cm-shadow);
  }
  .progress-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
  .progress-title{margin:0;font-size:22px;font-weight:800;color:var(--cm-green-dark)}
  .progress-sub{margin:4px 0 0;color:#0f766e;font-size:14px}
  .progress-sub b{font-weight:700;color:var(--cm-green-dark)}
  .reset-btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:8px 14px;border-radius:10px;background:#fff;
    border:1px solid #b7ebd5;color:var(--cm-green-dark);
    font-weight:600;font-size:13px;cursor:pointer;font-family:inherit;
  }
  .reset-btn:hover{background:#f0fdf4}
  .reset-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}

  .progress-row{display:flex;justify-content:space-between;font-size:13px;color:#0f766e;font-weight:500}
  .bar{height:8px;background:#c9efde;border-radius:999px;overflow:hidden}
  .bar > span{display:block;height:100%;background:linear-gradient(90deg,var(--cm-green),#34d399);border-radius:999px;transition:width .3s}

  .tasks-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:760px){.tasks-grid{grid-template-columns:1fr}}

  .task{
    background:#fff;border:1px solid var(--cm-border);border-radius:12px;
    padding:18px 20px;display:flex;gap:14px;align-items:flex-start;
    transition:border-color .15s, box-shadow .15s;
  }
  .task:hover{border-color:var(--cm-green);box-shadow:var(--cm-shadow)}
  .task.done{background:#f8fafc;opacity:.75}
  .task.done .task-title{text-decoration:line-through;color:var(--cm-muted)}

  .task-check{
    width:20px;height:20px;border:2px solid #cbd5e1;border-radius:5px;
    flex:none;margin-top:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    background:#fff;
  }
  .task-check.checked{background:var(--cm-green);border-color:var(--cm-green)}
  .task-check svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:3;display:none}
  .task-check.checked svg{display:block}

  .task-day{
    display:inline-flex;align-items:center;gap:6px;
    color:var(--cm-green);font-size:12px;font-weight:600;
    text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;
  }
  .task-day svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}
  .task-title{margin:0 0 4px;font-size:15px;font-weight:700;color:var(--cm-text)}
  .task-desc{margin:0;color:var(--cm-muted);font-size:13px;line-height:1.5}

  .stress-pill{
    display:inline-block;padding:2px 8px;border-radius:6px;
    background:#fef3c7;color:#92400e;font-weight:700;
  }
  .level-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px}
  .level-row .lbl{font-size:13px;color:#0f766e;font-weight:600;margin-right:4px}
  .level-btn{
    padding:6px 12px;border-radius:999px;border:1px solid #b7ebd5;
    background:#fff;color:var(--cm-green-dark);font-weight:600;font-size:12px;
    cursor:pointer;font-family:inherit;
  }
  .level-btn:hover{background:#f0fdf4}
  .level-btn.active{background:var(--cm-green);color:#fff;border-color:var(--cm-green)}
</style>
</head>
<body>

    <p class="cm-brand-sub">Student Mental Wellness</p>
    <div class="cm-user">
      <div class="cm-avatar">AJ</div>
      <div>
        <div class="cm-uname">AJ</div>
        <div class="cm-urole">Undergraduate</div>
      </div>
    </div>
    <nav class="cm-nav">
      <a href="dashboard.html"><svg viewBox="0 0 24 24"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>Dashboard</a>

      <a href="resource_library.html"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2z"/><path d="M8 7h8M8 11h8"/></svg>Resources</a>
      <a href="support.html"><svg viewBox="0 0 24 24"><path d="M22 16.92V21a1 1 0 0 1-1.11 1A19 19 0 0 1 2 4.11 1 1 0 0 1 3 3h4.09a1 1 0 0 1 1 .75l1 4a1 1 0 0 1-.29 1L7 10.5a16 16 0 0 0 6.5 6.5l1.75-1.79a1 1 0 0 1 1-.29l4 1a1 1 0 0 1 .75 1z"/></svg>Support</a>
      <a href="about_us.html"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5"/><circle cx="17" cy="9" r="2"/><path d="M15 20c0-2 2-4 5-4"/></svg>About Us</a>
    </nav>
    <a href="index.html" class="cm-logout">

  <main class="cm-main">
    <h2 class="cm-page-title">Your 21-Day Wellness Plan</h2>

    <div class="progress-card">
      <div class="progress-top">
        <div>
          <h3 class="progress-title"><span id="done-count">0</span> / 21 Tasks Completed</h3>
          <p class="progress-sub">Personalized plan for <b><span class="stress-pill" id="stress-level">High</span></b> stress level</p>
        </div>
        <button class="reset-btn" id="reset-btn">

        </button>

      <div class="level-row">

        <button type="button" class="level-btn" data-level="Mild">Mild</button>
        <button type="button" class="level-btn" data-level="Normal">Normal</button>
        <button type="button" class="level-btn" data-level="Moderate">Moderate</button>
        <button type="button" class="level-btn" data-level="High">High</button>
      </div>
      <div>
        <div class="progress-row"><span>Overall Progress</span><span id="progress-pct">0%</span></div>

    <div id="tasks" class="tasks-grid"></div>

    <div id="cm-footer-slot"></div>

</div>

<!-- Inline JSON: pool of activities per stress level. Edit freely. -->

      { "title":"Gentle Stretching",    "desc":"10 minutes of light stretching or yoga" },

<script>
/*
  Daily Task selection uses Modular Arithmetic (per spec):
    index = (day - 1) mod totalActivities
  Day 1..21 cycles through the activity pool for the user's stress level.
*/
(function(){
  var STORAGE_KEY = 'cm_daily_progress_v1';
  var LEVEL_KEY   = 'cm_stress_level_v1';
  var TOTAL_DAYS = 21;
  var FALLBACK = JSON.parse(document.getElementById('tasks-data').textContent);
  var data = FALLBACK;
  var completed = loadProgress();

  // Restore previously chosen stress level (if any)
  try {
    var saved = localStorage.getItem(LEVEL_KEY);
    if(saved) data.stressLevel = saved;
  } catch(e){}

  function loadProgress(){
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
    catch(e){ return {}; }
  }
  function saveProgress(){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(completed)); } catch(e){}
  }
  function saveLevel(){
    try { localStorage.setItem(LEVEL_KEY, data.stressLevel); } catch(e){}
  }

  function loadTasksJSON(){
    var xhr = new XMLHttpRequest();
    xhr.open('GET','tasks.json',true);
    xhr.onreadystatechange = function(){
      if(xhr.readyState===4){
        try{
          if((xhr.status===200||xhr.status===0) && xhr.responseText){
            var fetched = JSON.parse(xhr.responseText);
            // Keep user's chosen level; just refresh pools
            fetched.stressLevel = data.stressLevel || fetched.stressLevel;
            data = fetched;
          }
        }catch(e){ /* keep fallback */ }
        render();
      }
    };
    try{ xhr.send(); } catch(e){ render(); }
  }

  function buildPlan(){
    var level = data.stressLevel || 'Mild';
    var pool = (data.pools && data.pools[level]) || [];
    if(!pool.length) return [];
    var plan = [];
    for(var day=1; day<=TOTAL_DAYS; day++){
      var idx = (day - 1) % pool.length;   // ← Modulo logic
      plan.push({ day:day, title:pool[idx].title, desc:pool[idx].desc });
    }
    return plan;
  }

  function render(){
    var lvl = data.stressLevel || 'Mild';
    document.getElementById('stress-level').textContent = lvl;

    // Highlight active level button
    document.querySelectorAll('.level-btn').forEach(function(b){
      b.classList.toggle('active', b.dataset.level === lvl);
    });

    var plan = buildPlan();
    var doneCount = plan.filter(function(t){return completed[t.day];}).length;
    var pct = Math.round((doneCount/TOTAL_DAYS)*100);
    document.getElementById('done-count').textContent = doneCount;
    document.getElementById('progress-pct').textContent = pct+'%';
    document.getElementById('progress-bar').style.width = pct+'%';

    var tpl = plan.map(function(t){
      var done = !!completed[t.day];
      return ''
        + '<div class="task '+(done?'done':'')+'" data-day="'+t.day+'">'
        +   '<div class="task-check '+(done?'checked':'')+'">'
        +     '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>'
        +   '</div>'
        +   '<div>'
        +     '<div class="task-day"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg> Day '+t.day+'</div>'
        +     '<h4 class="task-title">'+t.title+'</h4>'
        +     '<p class="task-desc">'+t.desc+'</p>'
        +   '</div>'
        + '</div>';
    }).join('');
    document.getElementById('tasks').innerHTML = tpl;

    document.querySelectorAll('.task').forEach(function(el){
      el.addEventListener('click', function(){
        var d = el.dataset.day;
        completed[d] = !completed[d];
        saveProgress(); render();
      });
    });
  }

  // Stress-level switcher
  document.querySelectorAll('.level-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      data.stressLevel = btn.dataset.level;
      saveLevel();
      render();
    });
  });

  document.getElementById('reset-btn').addEventListener('click', function(){
    if(confirm('Reset all progress?')){ completed = {}; saveProgress(); render(); }
  });

  loadTasksJSON();
})();
</script>

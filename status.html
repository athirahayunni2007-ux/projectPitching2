<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Result - CampusMind</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .status-container { text-align: center; padding-top: 20px; }
        .result-box { 
            background: #ffffff; 
            border: 2px solid #88ab8e; 
            border-radius: 15px; 
            padding: 25px; 
            text-align: left; 
            margin: 20px 0;
        }
        .result-value { color: #709677; font-size: 32px; font-weight: bold; }
        .btn-green {
            background-color: #709677;
            color: white;
            padding: 15px;
            width: 100%;
            border-radius: 10px;
            text-decoration: none;
            display: block;
            font-weight: bold;
            border: none;
            box-sizing: border-box;
        }
        .btn-green:hover {
            background-color: #5a7a60;
        }
    </style>
</head>
<body>
    <div class="screening-card status-container">
        <h1 style="max-width: 100%; color: #3d4a3e;">Assessment Complete</h1>
        <p style="color: #7a8a7c;">Here are your results and personalized recommendations.</p>

        <div class="result-box">
            <p style="font-size: 14px; color: #7a8a7c;">Your stress level is</p>
            <p class="result-value" id="level">Normal</p>
            <p id="message" style="font-size: 14px; color: #3d4a3e;">You are doing well, keep it up!</p>
        </div>

        <a href="dashboard.html" class="btn-green">Go to Dashboard</a>
    </div>

    <script>
        const results = JSON.parse(localStorage.getItem('dass_results'));
        const level = document.getElementById('level');
        const message = document.getElementById('message');

        if (results) {
            const score = results.s; // Ambil score Stress (s) sahaja untuk paparan utama
            
            if (score <= 14) { 
                level.innerText = "Normal"; 
                message.innerText = "You're handling things great!"; 
            }
            else if (score <= 18) { 
                level.innerText = "Mild"; 
                message.innerText = "You're experiencing mild stress. Self-care is recommended."; 
            }
            else if (score <= 25) {
                level.innerText = "Moderate";
                message.innerText = "Consider taking a break or talking to a friend.";
            }
            else { 
                level.innerText = "Severe"; 
                message.innerText = "Please consider seeking support or professional advice."; 
            }
        }
    </script>
</body>
</html>

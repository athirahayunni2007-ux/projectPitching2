<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result - CampusMind</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="style.css" />
    <style>
        /* Forces the body to center the content absolutely, ignoring external layout leaks */
        body {
            background-color: var(--cm-bg, #f0f4f2) !important;
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            min-height: 100vh !important;
            margin: 0 !important;
            padding: 20px !important;
            box-sizing: border-box !important;
            position: relative !important;
        }

        /* Fixes the accessibility toolbar to the top right corner without shifting page flow */
        .accessibility-fixed-top {
            position: fixed !important;
            top: 20px !important;
            right: 20px !important;
            z-index: 9999 !important;
        }

        @media (max-width: 600px) {
            .accessibility-fixed-top {
                top: 15px !important;
                right: 15px !important;
            }
        }
    </style>
</head>
<body>

    <div class="accessibility-fixed-top">
        <div class="accessibility-tools">
            <button class="btn-access" onclick="changeFontSize('up')" title="Increase text size">A+</button>
            <button class="btn-access" onclick="changeFontSize('down')" title="Decrease text size">A-</button>
        </div>
    </div>

    <div class="screening-card" style="width: 100%; max-width: 480px; box-sizing: border-box;">
        <h1 id="text-title" style="font-size: 1.6em; font-weight: 700; color: #3d4a3e; margin: 0 auto 10px auto; text-align: center;">Assessment Complete</h1>
        <p id="text-sub" style="font-size: 0.95em; color: #7a8a7c; margin: 0 auto 30px auto; text-align: center;">Here are your results and personalized recommendations.</p>

        <div class="stress-box">
            <p id="text-lbl" style="font-size: 0.85em; color: #7a8a7c; margin: 0 0 8px 0; text-transform: uppercase; letter-spacing: 0.05em;">Your stress level is</p>
            <span class="stress-value" id="level" style="font-size: 2em;">NORMAL</span>
            <p id="message" style="font-size: 0.9em; color: #3d4a3e; margin: 0; line-height: 1.5;">You are doing well, keep it up!</p>
        </div>

        <a id="text-btn" href="dashboard.html" class="btn-main">Go to Dashboard</a>
        
        <footer>
            <p id="text-disc" style="font-size: 0.75em; color: #7a8a7c; margin: 25px 0 0 0; line-height: 1.4; text-align: center;">This assessment is not a professional medical diagnosis. Please consult a specialist if you need clinical support.</p>
        </footer>
    </div>

    <script>
        // Retrieve internal user testing variables securely saved within localStorage
        const results = JSON.parse(localStorage.getItem('dass_results'));
        const level = document.getElementById('level');
        const message = document.getElementById('message');

        let scaleStep = 0; 

        // Font scaling core mechanics mapping static arrays for predictable scaling
        function changeFontSize(action) {
            if (action === 'up' && scaleStep < 4) {
                scaleStep += 1;
            } else if (action === 'down' && scaleStep > 0) {
                scaleStep -= 1;
            }

            const titleSize = [1.6, 1.8, 2.0, 2.2, 2.4];
            const subSize = [0.95, 1.05, 1.15, 1.25, 1.35];
            const lblSize = [0.85, 0.95, 1.05, 1.15, 1.25];
            const levelSize = [2.0, 2.2, 2.4, 2.6, 2.8];
            const msgSize = [0.9, 1.0, 1.1, 1.2, 1.3];
            const btnSize = [1.0, 1.1, 1.2, 1.3, 1.4];
            const discSize = [0.75, 0.85, 0.95, 1.05, 1.15];

            document.getElementById('text-title').style.fontSize = titleSize[scaleStep] + 'em';
            document.getElementById('text-sub').style.fontSize = subSize[scaleStep] + 'em';
            document.getElementById('text-lbl').style.fontSize = lblSize[scaleStep] + 'em';
            document.getElementById('level').style.fontSize = levelSize[scaleStep] + 'em';
            document.getElementById('message').style.fontSize = msgSize[scaleStep] + 'em';
            document.getElementById('text-btn').style.fontSize = btnSize[scaleStep] + 'em';
            document.getElementById('text-disc').style.fontSize = discSize[scaleStep] + 'em';
        }

        // Conditional render engine processing score datasets to feed current tier values
        function displayResults() {
            if (results) {
                const score = results.s;
                if (score <= 14) { 
                    level.innerText = "NORMAL"; 
                    message.innerText = "You're handling things great! Keep maintaining your current wellness routines."; 
                }
                else if (score <= 18) { 
                    level.innerText = "MILD"; 
                    message.innerText = "You're experiencing mild stress. Engaging in basic self-care tools is recommended."; 
                }
                else if (score <= 25) {
                    level.innerText = "MODERATE";
                    message.innerText = "Your stress levels are climbing. Consider taking a short break or talking to a peer.";
                }
                else { 
                    level.innerText = "HIGH"; 
                    message.innerText = "Your scores indicate heavy stress pressures. Please consider seeking guidance or campus support."; 
                }
            }
        }
        displayResults();
    </script>
</body>
</html>
